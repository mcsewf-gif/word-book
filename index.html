<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美式英语生词本</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; text-align: center; }
    input, button { padding: 12px; margin: 10px 0; width: 85%; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background-color: #4CAF50; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:disabled { background-color: #ccc; }
    #result { margin-top: 20px; text-align: left; background: #f9f9f9; padding: 15px; border-radius: 8px; }
    .audio-btn { background: #007AFF; margin-left: 10px; width: auto; padding: 4px 10px; font-size: 13px; display: inline-block; }
  </style>
</head>
<body>

  <h2>美式英语生词本</h2>
  <input type="text" id="wordInput" placeholder="请输入英文单词...">
  <br>
  <button id="submitBtn" onclick="processWord()">查询、发音并保存</button>

  <div id="result"></div>

  <script>
    // ⚠️ 替换为你自己的 Google Apps Script Web App 地址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxZhdbmtcCtBQOIHd9vy5eHtQvqpXPlecnvpVZ1qtWTope1tiGbxrtwKlBBFHOfLWfj/exec
";

    function playAudio(word) {
      const audioUrl = `https://dict.youdao.com/dictvoice?type=2&audio=${encodeURIComponent(word)}`;
      const audio = new Audio(audioUrl);
      audio.play().catch(() => {
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
      });
    }

    async function processWord() {
      const word = document.getElementById('wordInput').value.trim();
      const resultDiv = document.getElementById('result');
      const btn = document.getElementById('submitBtn');

      if (!word) {
        alert("请输入单词！");
        return;
      }

      btn.disabled = true;
      resultDiv.innerHTML = "正在查询并记录...";

      // 播放发音
      playAudio(word);

      let phonetic = "";
      let partOfSpeech = "";
      let meaning = "";

      // 1. 获取单词释义与音标
      try {
        const dictRes = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
        if (dictRes.ok) {
          const dictData = await dictRes.json();
          const entry = dictData[0];
          phonetic = entry.phonetic || (entry.phonetics && entry.phonetics.find(p => p.text)?.text) || "";
          const meaningObj = (entry.meanings && entry.meanings[0]) || {};
          partOfSpeech = meaningObj.partOfSpeech || "";
          meaning = meaningObj.definitions[0]?.definition || "";
        } else {
          meaning = "未找到详细释义";
        }
      } catch (e) {
        meaning = "词典查询受限（已记录单词）";
      }

      // 2. 渲染前端页面
      resultDiv.innerHTML = `
        <p><strong>单词:</strong> ${word} <button class="audio-btn" onclick="playAudio('${word}')">🔊 播放</button></p>
        <p><strong>音标:</strong> ${phonetic || '-'}</p>
        <p><strong>词性:</strong> ${partOfSpeech || '-'}</p>
        <p><strong>释义:</strong> ${meaning || '-'}</p>
      `;

      // 3. 提交数据给 Google Sheets（使用原生 form 方案，百分百穿透 Safari 跨域限制）
      try {
        const formData = new FormData();
        formData.append('word', word);
        formData.append('phonetic', phonetic);
        formData.append('partOfSpeech', partOfSpeech);
        formData.append('meaning', meaning);

        await fetch(GAS_URL, {
          method: "POST",
          mode: "no-cors",
          body: formData
        });

        resultDiv.innerHTML += `<p style="color:green;margin-top:10px;font-weight:bold;">✓ 已成功写入 Google Sheet！</p>`;
      } catch (err) {
        resultDiv.innerHTML += `<p style="color:red;margin-top:10px;">写入 Sheet 失败: ${err.message}</p>`;
      } finally {
        btn.disabled = false;
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
