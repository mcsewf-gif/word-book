<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美式英语生词本</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; text-align: center; }
    input, button { padding: 12px; margin: 10px 0; width: 85%; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background-color: #4CAF50; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:disabled { background-color: #ccc; }
    #result { margin-top: 20px; text-align: left; background: #f9f9f9; padding: 15px; border-radius: 8px; }
    .audio-btn { background: #007AFF; margin-left: 10px; width: auto; padding: 4px 10px; font-size: 13px; display: inline-block; }
  </style>
</head>
<body>

  <h2>美式英语生词本</h2>
  <input type="text" id="wordInput" placeholder="请输入英文单词...">
  <br>
  <button id="submitBtn" onclick="processWord()">查询、发音并保存</button>

  <div id="result"></div>

  <script>
  // ⚠️ 替换为你自己的 Google Apps Script Web App 地址
  const GAS_URL = "https://script.google.com/macros/s/AKfycby6C_GXmNJm6A5WeBf0p-RrTG7ZdPNY7MaItW0UE8yQHOPpZ-DSx56OXoofet7H_jwI/exec";

  // 1. 发音逻辑
  function playAudio(word) {
    try {
      const utterance = new SpeechSynthesisUtterance(word);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    } catch(e) {
      console.log("语音播放错误:", e);
    }
  }

  // 2. 跨域 JSONP 获取有道词典数据（美音音标 + 准确词性 + 中文释义）
  function fetchYoudao(word) {
    return new Promise((resolve) => {
      const cbName = 'yd_cb_' + Math.random().toString(36).substr(2, 8);
      const script = document.createElement('script');
      
      const timer = setTimeout(() => {
        cleanup();
        resolve(null);
      }, 3000);

      function cleanup() {
        clearTimeout(timer);
        if (window[cbName]) delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      window[cbName] = function(data) {
        cleanup();
        resolve(data);
      };

      script.src = `https://suggest.dict.youdao.com/suggest?q=${encodeURIComponent(word)}&num=1&doctype=json&callback=${cbName}`;
      script.onerror = () => { cleanup(); resolve(null); };
      document.body.appendChild(script);
    });
  }

  // 3. 解析有道 API 结果
  async function fetchWordDetails(word) {
    let phonetic = "";
    let partOfSpeech = "";
    let meaning = "";

    try {
      const data = await fetchYoudao(word);
      if (data && data.data && data.data.entries && data.data.entries.length > 0) {
        const entry = data.data.entries[0];
        const rawExplain = entry.explain || "";

        // 解析词性和释义，例如 "n. 桥；v. 跨越" -> 词性: "n. / v.", 释义: "桥；跨越"
        const parts = [];
        const meanings = [];
        const explainItems = rawExplain.split(';');

        explainItems.forEach(item => {
          const match = item.trim().match(/^([a-zA-Z]+\.)\s*(.*)$/);
          if (match) {
            if (!parts.includes(match[1])) parts.push(match[1]);
            meanings.push(match[2]);
          } else if (item.trim()) {
            meanings.push(item.trim());
          }
        });

        partOfSpeech = parts.join(' ') || "n.";
        meaning = meanings.join('；') || rawExplain;
      }
    } catch (e) {
      console.error("有道解析失败:", e);
    }

    // 独立查美式音标 (US Phonetic)
    try {
      const dictRes = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
      if (dictRes.ok) {
        const dictData = await dictRes.json();
        const entry = dictData[0];
        if (entry.phonetics && entry.phonetics.length > 0) {
          // 优先找美音音频对应的音标，没有则取默认音标
          const usItem = entry.phonetics.find(p => p.audio && p.audio.includes('-us'));
          phonetic = (usItem && usItem.text) || entry.phonetic || entry.phonetics.find(p => p.text)?.text || "";
        } else {
          phonetic = entry.phonetic || "";
        }
      }
    } catch (e) {}

    return {
      phonetic: phonetic || "",
      partOfSpeech: partOfSpeech || "-",
      meaning: meaning || "-"
    };
  }

  async function processWord() {
    const wordInput = document.getElementById('wordInput');
    const resultDiv = document.getElementById('result');
    const btn = document.getElementById('submitBtn');

    const word = wordInput.value.trim();

    if (!word) {
      alert("请输入单词！");
      return;
    }

    btn.disabled = true;
    resultDiv.innerHTML = "正在查询并记录...";

    // 播放发音
    playAudio(word);

    try {
      const res = await fetchWordDetails(word);

      // 呈现结果
      resultDiv.innerHTML = `
        <p><strong>单词:</strong> ${word} <button class="audio-btn" onclick="playAudio('${word}')">🔊 播放</button></p>
        <p><strong>音标:</strong> ${res.phonetic ? '/' + res.phonetic.replace(/\//g, '') + '/' : '-'}</p>
        <p><strong>词性:</strong> ${res.partOfSpeech}</p>
        <p><strong>中文释义:</strong> ${res.meaning}</p>
      `;

      // 提交至 Google Sheet
      const formData = new FormData();
      formData.append('word', word);
      formData.append('phonetic', res.phonetic ? '/' + res.phonetic.replace(/\//g, '') + '/' : '');
      formData.append('partOfSpeech', res.partOfSpeech);
      formData.append('meaning', res.meaning);

      await fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        body: formData
      });

      resultDiv.innerHTML += `<p style="color:green;margin-top:10px;font-weight:bold;">✓ 已成功写入 Google Sheet！</p>`;

    } catch (err) {
      resultDiv.innerHTML = `<p style="color:red;margin-top:10px;">程序运行错误: ${err.message}</p>`;
    } finally {
      btn.disabled = false;
    }
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
</script>
</body>
</html>
