<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单词记账本 PWA</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; text-align: center; }
    input, button { padding: 12px; margin: 10px 0; width: 85%; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background-color: #4CAF50; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:disabled { background-color: #ccc; }
    #result { margin-top: 20px; text-align: left; background: #f9f9f9; padding: 15px; border-radius: 8px; }
    .audio-btn { background: #007AFF; margin-top: 10px; width: auto; padding: 6px 15px; font-size: 14px; }
  </style>
</head>
<body>

  <h2>美式英语生词本</h2>
  <input type="text" id="wordInput" placeholder="请输入英文单词...">
  <br>
  <button id="submitBtn" onclick="processWord()">查询、发音并保存</button>

  <div id="result"></div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxZhdbmtcCtBQOIHd9vy5eHtQvqpXPlecnvpVZ1qtWTope1tiGbxrtwKlBBFHOfLWfj/exec";

    // 播放发音函数
    function playAudio(word) {
      // 官方美式发音源
      const audioUrl = `https://dict.youdao.com/dictvoice?type=2&audio=${encodeURIComponent(word)}`;
      const audio = new Audio(audioUrl);
      audio.play().catch(e => {
        // 兜底使用系统语音
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
      });
    }

    async function processWord() {
      const word = document.getElementById('wordInput').value.trim();
      const resultDiv = document.getElementById('result');
      const btn = document.getElementById('submitBtn');

      if (!word) {
        alert("请输入单词！");
        return;
      }

      btn.disabled = true;
      resultDiv.innerHTML = "正在查询并记录...";

      // 先播放发音（解决 iOS 异步拦截）
      playAudio(word);

      try {
        const dictRes = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
        if (!dictRes.ok) throw new Error("未找到该单词信息");
        
        const dictData = await dictRes.json();
        const entry = dictData[0];

        const phonetic = entry.phonetic || (entry.phonetics.find(p => p.text)?.text) || "";
        const meaningObj = entry.meanings[0] || {};
        const partOfSpeech = meaningObj.partOfSpeech || "";
        const meaning = meaningObj.definitions[0]?.definition || "";

        resultDiv.innerHTML = `
          <p><strong>单词:</strong> ${word} <button class="audio-btn" onclick="playAudio('${word}')">🔊 重新播放</button></p>
          <p><strong>音标:</strong> ${phonetic}</p>
          <p><strong>词性:</strong> ${partOfSpeech}</p>
          <p><strong>释义:</strong> ${meaning}</p>
        `;

        await fetch(GAS_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            word: word,
            phonetic: phonetic,
            partOfSpeech: partOfSpeech,
            meaning: meaning
          })
        });

        resultDiv.innerHTML += `<p style="color:green;margin-top:10px;">✓ 已保存到 Google Sheet！</p>`;

      } catch (err) {
        resultDiv.innerHTML = `<p style="color:red;">错误: ${err.message}</p>`;
      } finally {
        btn.disabled = false;
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
