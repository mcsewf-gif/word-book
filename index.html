<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美式英语生词本</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; text-align: center; }
    input, button { padding: 12px; margin: 10px 0; width: 85%; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background-color: #4CAF50; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:disabled { background-color: #ccc; }
    #result { margin-top: 20px; text-align: left; background: #f9f9f9; padding: 15px; border-radius: 8px; }
    .audio-btn { background: #007AFF; margin-left: 10px; width: auto; padding: 4px 10px; font-size: 13px; display: inline-block; }
  </style>
</head>
<body>

  <h2>美式英语生词本</h2>
  <input type="text" id="wordInput" placeholder="请输入英文单词...">
  <br>
  <button id="submitBtn" onclick="processWord()">查询、发音并保存</button>

  <div id="result"></div>

  <script>
    // ⚠️ 请务必替换为你自己的 Google Apps Script Web App URL（结尾必须是 /exec）
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxZhdbmtcCtBQOIHd9vy5eHtQvqpXPlecnvpVZ1qtWTope1tiGbxrtwKlBBFHOfLWfj/exec";

    // 1. 发音逻辑
    function playAudio(word) {
      try {
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      } catch(e) {
        console.log("语音播放不兼容:", e);
      }
    }

    // 2. Google 翻译 API 查询
    async function fetchGoogleTranslate(word) {
      let meaning = "";
      let partOfSpeech = "";
      let phonetic = "";

      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&dt=bd&dt=rm&q=${encodeURIComponent(word)}`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          
          // 获取中文含义
          if (data && data[0] && data[0][0] && data[0][0][0]) {
            meaning = data[0][0][0];
          }
          // 获取读音音标/拼音
          if (data && data[0] && data[0][1] && data[0][1][3]) {
            phonetic = data[0][1][3];
          }
          // 获取词性
          if (data && data[1] && data[1][0] && data[1][0][0]) {
            partOfSpeech = data[1][0][0];
          }
        }
      } catch (e) {
        console.error("Google 翻译 API 失败:", e);
      }

      // 兜底查音标
      if (!phonetic) {
        try {
          const dictRes = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
          if (dictRes.ok) {
            const dictData = await dictRes.json();
            phonetic = dictData[0]?.phonetic || (dictData[0]?.phonetics?.find(p => p.text)?.text) || "";
          }
        } catch(e) {}
      }

      return { meaning, partOfSpeech, phonetic };
    }

    async function processWord() {
      const wordInput = document.getElementById('wordInput');
      const resultDiv = document.getElementById('result');
      const btn = document.getElementById('submitBtn');

      const word = wordInput.value.trim();

      if (!word) {
        alert("请输入单词！");
        return;
      }

      btn.disabled = true;
      resultDiv.innerHTML = "正在查询并记录...";

      // 先发音
      playAudio(word);

      try {
        const res = await fetchGoogleTranslate(word);

        // 呈现结果
        resultDiv.innerHTML = `
          <p><strong>单词:</strong> ${word} <button class="audio-btn" onclick="playAudio('${word}')">🔊 播放</button></p>
          <p><strong>音标:</strong> ${res.phonetic || '-'}</p>
          <p><strong>词性:</strong> ${res.partOfSpeech || '-'}</p>
          <p><strong>中文释义:</strong> ${res.meaning || '-'}</p>
        `;

        // 提交至 Google Sheet
        const formData = new FormData();
        formData.append('word', word);
        formData.append('phonetic', res.phonetic || '');
        formData.append('partOfSpeech', res.partOfSpeech || '');
        formData.append('meaning', res.meaning || '');

        await fetch(GAS_URL, {
          method: "POST",
          mode: "no-cors",
          body: formData
        });

        resultDiv.innerHTML += `<p style="color:green;margin-top:10px;font-weight:bold;">✓ 已成功写入 Google Sheet！</p>`;

      } catch (err) {
        resultDiv.innerHTML = `<p style="color:red;margin-top:10px;">程序运行错误: ${err.message}</p>`;
      } finally {
        btn.disabled = false;
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    }
  </script>
</body>
</html>
