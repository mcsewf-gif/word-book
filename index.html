<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美式英语生词本</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; text-align: center; }
    input, button { padding: 12px; margin: 10px 0; width: 85%; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background-color: #4CAF50; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:disabled { background-color: #ccc; }
    #result { margin-top: 20px; text-align: left; background: #f9f9f9; padding: 15px; border-radius: 8px; }
    .audio-btn { background: #007AFF; margin-left: 10px; width: auto; padding: 4px 10px; font-size: 13px; display: inline-block; }
  </style>
</head>
<body>

  <h2>美式英语生词本</h2>
  <input type="text" id="wordInput" placeholder="请输入英文单词...">
  <br>
  <button id="submitBtn" onclick="processWord()">查询、发音并保存</button>

  <div id="result"></div>

  <script>
  // ⚠️ 粘贴你刚刚新生成的 Web App URL（结尾必须是 /exec）
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyFv2zLNxi2CESerHMQuquqnEMqYtK3yNFGx3y82JrXAJAi6NSXWra4zDC6Ry4uKdTm/exec";

  function playAudio(word) {
    try {
      const utterance = new SpeechSynthesisUtterance(word);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    } catch(e) {
      console.log("发音错误:", e);
    }
  }

  // 查词逻辑
  async function fetchWordDetails(word) {
    let phonetic = "";
    let partOfSpeech = "";
    let meaning = "";

    // 1. 获取音标和词性
    try {
      const dictRes = await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/" + encodeURIComponent(word));
      if (dictRes.ok) {
        const dictData = await dictRes.json();
        if (dictData && dictData[0]) {
          const entry = dictData[0];
          // 查找美音音标
          if (entry.phonetic) {
            phonetic = entry.phonetic;
          } else if (entry.phonetics && entry.phonetics.length > 0) {
            const usItem = entry.phonetics.find(p => p.audio && p.audio.includes('-us'));
            const textItem = entry.phonetics.find(p => p.text);
            phonetic = (usItem && usItem.text) || (textItem && textItem.text) || "";
          }

          // 提取词性
          if (entry.meanings && entry.meanings.length > 0) {
            const posList = entry.meanings.map(m => m.partOfSpeech);
            // 去重合并
            partOfSpeech = [...new Set(posList)].join(", ");
          }
        }
      }
    } catch (e) {
      console.error("查音标失败:", e);
    }

    // 2. 获取中文释义
    try {
      const transRes = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(word) + "&langpair=en|zh-CN");
      if (transRes.ok) {
        const transData = await transRes.json();
        if (transData && transData.responseData) {
          meaning = transData.responseData.translatedText || "";
        }
      }
    } catch (e) {
      console.error("查翻译失败:", e);
    }

    return {
      phonetic: phonetic ? (phonetic.startsWith('/') ? phonetic : '/' + phonetic + '/') : "-" ,
      partOfSpeech: partOfSpeech || "-",
      meaning: meaning || "-"
    };
  }

  async function processWord() {
    const wordInput = document.getElementById('wordInput');
    const resultDiv = document.getElementById('result');
    const btn = document.getElementById('submitBtn');

    const word = wordInput.value.trim();

    if (!word) {
      alert("请输入单词！");
      return;
    }

    btn.disabled = true;
    resultDiv.innerHTML = "正在查询并保存...";

    playAudio(word);

    try {
      // 在前端完成查询
      const details = await fetchWordDetails(word);

      // 实时展示结果
      resultDiv.innerHTML = `
        <p><strong>单词:</strong> ${word} <button class="audio-btn" onclick="playAudio('${word}')">🔊 播放</button></p>
        <p><strong>音标:</strong> ${details.phonetic}</p>
        <p><strong>词性:</strong> ${details.partOfSpeech}</p>
        <p><strong>中文释义:</strong> ${details.meaning}</p>
      `;

      // 提交到 Google Sheet
      const formData = new FormData();
      formData.append('word', word);
      formData.append('phonetic', details.phonetic);
      formData.append('partOfSpeech', details.partOfSpeech);
      formData.append('meaning', details.meaning);

      await fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        body: formData
      });

      resultDiv.innerHTML += `<p style="color:green;margin-top:10px;font-weight:bold;">✓ 已成功写入 Google Sheet！</p>`;

    } catch (err) {
      resultDiv.innerHTML += `<p style="color:red;margin-top:10px;">错误详情: ${err.message}</p>`;
    } finally {
      btn.disabled = false;
    }
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
</script>

</body>
</html>
