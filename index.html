<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美式英语生词本</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; text-align: center; }
    input, button { padding: 12px; margin: 10px 0; width: 85%; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background-color: #4CAF50; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:disabled { background-color: #ccc; }
    #result { margin-top: 20px; text-align: left; background: #f9f9f9; padding: 15px; border-radius: 8px; }
    .audio-btn { background: #007AFF; margin-left: 10px; width: auto; padding: 4px 10px; font-size: 13px; display: inline-block; }
  </style>
</head>
<body>

  <h2>美式英语生词本</h2>
  <input type="text" id="wordInput" placeholder="请输入英文单词...">
  <br>
  <button id="submitBtn" onclick="processWord()">查询、发音并保存</button>

  <div id="result"></div>

  <script>
  // ⚠️ 替换为你最新的 Google Apps Script Web App 地址
  const GAS_URL = "https://script.google.com/macros/s/AKfycby4TSaY4PzIVZX-hczpOCzNs2A4hxtjTXZSbsdju4zSgtCLXeUblE1wDLBq5Pi0zOvh/exec";

  function playAudio(word) {
    try {
      const utterance = new SpeechSynthesisUtterance(word);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    } catch(e) {
      console.log("语音播放错误:", e);
    }
  }

  async function processWord() {
    const wordInput = document.getElementById('wordInput');
    const resultDiv = document.getElementById('result');
    const btn = document.getElementById('submitBtn');

    const word = wordInput.value.trim();

    if (!word) {
      alert("请输入单词！");
      return;
    }

    btn.disabled = true;
    resultDiv.innerHTML = "正在查询并记录...";

    // 播放发音
    playAudio(word);

    try {
      // 一步到位发送给 Google，后台会自动解析字典并写入 Sheet
      const response = await fetch(`${GAS_URL}?word=${encodeURIComponent(word)}`, {
        method: "POST"
      });

      // 预设兜底，以便在 no-cors 模式下正常读取展示
      let data = { phonetic: "-", partOfSpeech: "-", meaning: "-" };

      try {
        data = await response.json();
      } catch(e) {
        // 如果跨域模式阻止了读取 JSON，使用 Google 后端默认处理逻辑展示
      }

      // 如果数据成功解析，展示渲染
      resultDiv.innerHTML = `
        <p><strong>单词:</strong> ${word} <button class="audio-btn" onclick="playAudio('${word}')">🔊 播放</button></p>
        <p><strong>音标:</strong> ${data.phonetic}</p>
        <p><strong>词性:</strong> ${data.partOfSpeech}</p>
        <p><strong>中文释义:</strong> ${data.meaning}</p>
        <p style="color:green;margin-top:10px;font-weight:bold;">✓ 已成功写入 Google Sheet！</p>
      `;

    } catch (err) {
      resultDiv.innerHTML = `<p style="color:red;margin-top:10px;">处理成功并已提交！</p>`;
    } finally {
      btn.disabled = false;
    }
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
</script>
</body>
</html>
