<script>
  // ⚠️ 替换为你自己的 Google Apps Script Web App 地址
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxZhdbmtcCtBQOIHd9vy5eHtQvqpXPlecnvpVZ1qtWTope1tiGbxrtwKlBBFHOfLWfj/exec";

  // 1. Google 官方美式发音接口（纯正美音 en-US）
  function playAudio(word) {
    const googleAudioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(word)}&tl=en-US&client=tw-ob`;
    const audio = new Audio(googleAudioUrl);
    audio.play().catch(() => {
      // 备用：系统 TTS
      const utterance = new SpeechSynthesisUtterance(word);
      utterance.lang = 'en-US';
      window.speechSynthesis.speak(utterance);
    });
  }

  // 2. 使用 Google 翻译 API 获取中文释义、词性和音标
  async function fetchGoogleTranslate(word) {
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&dt=bd&dt=rm&q=${encodeURIComponent(word)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("Google API 请求失败");
    const data = await res.json();

    let meaning = "";
    let partOfSpeech = "";
    let phonetic = "";

    // 提取主要中文意思
    if (data[0] && data[0][0] && data[0][0][0]) {
      meaning = data[0][0][0];
    }

    // 提取美式拼音/音标 (拼音/IPA)
    if (data[0] && data[0][1] && data[0][1][3]) {
      phonetic = data[0][1][3];
    }

    // 提取词性 (如 noun, adjective)
    if (data[1] && data[1][0] && data[1][0][0]) {
      partOfSpeech = data[1][0][0]; // 例如 noun, verb
    }

    return { meaning, partOfSpeech, phonetic };
  }

  async function processWord() {
    const word = document.getElementById('wordInput').value.trim();
    const resultDiv = document.getElementById('result');
    const btn = document.getElementById('submitBtn');

    if (!word) {
      alert("请输入单词！");
      return;
    }

    btn.disabled = true;
    resultDiv.innerHTML = "正在查询并记录...";

    // 播放 Google 美式发音
    playAudio(word);

    let phonetic = "";
    let partOfSpeech = "";
    let meaning = "";

    try {
      // 查询 Google 翻译 API
      const result = await fetchGoogleTranslate(word);
      meaning = result.meaning || "";
      partOfSpeech = result.partOfSpeech || "";
      phonetic = result.phonetic || "";

      // 如果 Google 没有查到音标，尝试用字典 API 补充音标
      if (!phonetic) {
        const dictRes = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`).catch(() => null);
        if (dictRes && dictRes.ok) {
          const dictData = await dictRes.json();
          phonetic = dictData[0]?.phonetic || (dictData[0]?.phonetics?.find(p => p.text)?.text) || "";
        }
      }
    } catch (e) {
      console.error("查询失败:", e);
      meaning = "查询失败，请检查网络";
    }

    // 渲染前端结果
    resultDiv.innerHTML = `
      <p><strong>单词:</strong> ${word} <button class="audio-btn" onclick="playAudio('${word}')">🔊 播放</button></p>
      <p><strong>音标:</strong> ${phonetic || '-'}</p>
      <p><strong>词性:</strong> ${partOfSpeech || '-'}</p>
      <p><strong>中文释义:</strong> ${meaning || '-'}</p>
    `;

    // 提交到 Google Sheets
    try {
      const formData = new FormData();
      formData.append('word', word);
      formData.append('phonetic', phonetic);
      formData.append('partOfSpeech', partOfSpeech);
      formData.append('meaning', meaning);

      await fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        body: formData
      });

      resultDiv.innerHTML += `<p style="color:green;margin-top:10px;font-weight:bold;">✓ 已成功写入 Google Sheet！</p>`;
    } catch (err) {
      resultDiv.innerHTML += `<p style="color:red;margin-top:10px;">写入 Sheet 失败: ${err.message}</p>`;
    } finally {
      btn.disabled = false;
    }
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
